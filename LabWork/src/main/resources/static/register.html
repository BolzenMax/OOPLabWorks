<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация аккаунта</title>
    <link rel="stylesheet" href="/css/ui.css">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>Регистрация аккаунта</h1>
    <form id="register-form" class="auth-form">
        <label for="register-login">Логин</label>
        <input id="register-login" name="login" type="text" required autocomplete="username" />
        <label for="register-password">Пароль</label>
        <input id="register-password" name="password" type="password" required autocomplete="new-password" />
        <label for="register-confirm">Пароль повторно</label>
        <input id="register-confirm" name="confirm" type="password" required autocomplete="new-password" />
        <button type="submit" class="primary">Создать аккаунт</button>
        <p id="register-error" class="auth-error" aria-live="polite"></p>
    </form>
    <p class="auth-hint">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
